name=JourTempo
version=1.0.0
author=Jour Tempo <contact@jourtempo.fr>
maintainer=Jour Tempo <contact@jourtempo.fr>
sentence=Read the French Tempo electricity tariff colour (blue, white, red) for today and tomorrow on ESP32 and ESP8266.
paragraph=Uses the free Jour Tempo JSON API (no key, no account), with colours published by RTE. Gives remaining days per colour, handles network loss and expired data (never a guessed colour) and keeps at least 10 minutes between requests.
category=Communication
url=https://github.com/jourtempo/tempo-esp32
architectures=esp32,esp8266
depends=ArduinoJson (>=7.0.0)
includes=JourTempo.h
